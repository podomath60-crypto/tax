<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>소득세 분류 수정기</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root { --bg:#f6f7f9; --fg:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#111827; --soft:#ffffff; --danger:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif; background:var(--bg); color:var(--fg); }
  header { position:sticky; top:0; z-index:10; background:linear-gradient(180deg,#dff3ff 0%,#eef8ff 100%); backdrop-filter: blur(10px); border-bottom:1px solid #b7def5; padding:12px 14px 10px; }
  h1 { margin:0 0 8px; font-size:18px; letter-spacing:-.04em; }
  .topline { display:flex; gap:8px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .count { font-size:13px; color:var(--muted); }
  .toolbar { display:grid; grid-template-columns:1fr 118px; gap:8px; margin-top:10px; }
  input, select, button { font:inherit; border:1px solid var(--line); border-radius:10px; background:#fff; min-height:40px; }
  input { width:100%; padding:0 12px; }
  select { width:100%; padding:0 10px; }
  button { padding:0 12px; font-weight:700; cursor:pointer; }
  .filters { display:none !important; }
  .actions { display:grid; grid-template-columns:1fr; gap:8px; margin-top:8px; }
  .primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .ghost { background:#fff; }
  main { padding:12px 10px 88px; max-width:960px; margin:0 auto; }
  .summary { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; margin:8px 0 12px; }
  .sumitem { background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px; }
  .sumitem b { display:block; font-size:14px; margin-bottom:3px; }
  .sumitem span { font-size:13px; color:var(--muted); }
  .row { background:var(--soft); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:9px; }
  .meta { display:flex; justify-content:space-between; gap:10px; font-size:12px; color:var(--muted); margin-bottom:6px; }
  .merchant { font-weight:800; letter-spacing:-.03em; line-height:1.35; margin-bottom:4px; }
  .amount { font-size:18px; font-weight:900; margin:2px 0 10px; }
  .categoryBlock { display:flex; flex-direction:column; gap:8px; }
  .currentCategoryLabel { display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:12px; color:var(--muted); }
  .currentCategoryValue { display:inline-flex; align-items:center; min-height:34px; padding:6px 12px; border-radius:999px; background:#111827; color:#fff; font-size:14px; font-weight:800; }
  .quickPad { display:flex; flex-wrap:wrap; gap:7px; }
  .catBtn, .moreBtn { appearance:none; border:1px solid var(--line); background:#fff; color:var(--fg); min-height:38px; padding:0 12px; border-radius:999px; font-size:14px; font-weight:700; cursor:pointer; }
  .catBtn.active { background:#111827; color:#fff; border-color:#111827; }
  .catBtn.is-original { box-shadow:0 0 0 1px #d1d5db inset; }
  .moreBtn { background:#f3f4f6; }
  .allPad { display:none; flex-wrap:wrap; gap:7px; padding-top:2px; }
  .allPad.open { display:flex; }
  .catHint { font-size:11px; color:var(--muted); }
  .modalBack { position:fixed; inset:0; background:rgba(17,24,39,.52); display:none; align-items:flex-end; justify-content:center; padding:0; z-index:40; }
  .modalBack.open { display:flex; }
  .modalPanel { width:min(1080px,100%); max-height:92vh; background:#fff; border-radius:22px 22px 0 0; overflow:hidden; box-shadow:0 -10px 30px rgba(0,0,0,.16); }
  .modalHead { position:sticky; top:0; z-index:2; background:rgba(255,255,255,.97); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:14px 14px 12px; }
  .modalTop { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .modalTitle { margin:0; font-size:18px; letter-spacing:-.04em; }
  .modalSub { margin-top:6px; font-size:12px; color:var(--muted); }
  .iconBtn { min-width:44px; min-height:44px; border-radius:12px; font-size:18px; }
  .modalBody { padding:14px; overflow:auto; max-height:calc(92vh - 72px); }
  .modalCards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-bottom:12px; }
  .modalCard { border:1px solid var(--line); border-radius:16px; padding:12px; background:linear-gradient(180deg,#fff,#f8fafc); }
  .modalCard b { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  .modalCard strong { font-size:20px; letter-spacing:-.03em; }
  .summaryTableWrap { border:1px solid var(--line); border-radius:18px; overflow:auto; background:#fff; }
  .summaryTable { width:100%; border-collapse:separate; border-spacing:0; min-width:760px; }
  .summaryTable th, .summaryTable td { padding:11px 12px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; font-size:13px; }
  .summaryTable thead th { position:sticky; top:0; z-index:1; background:#f8fafc; font-weight:800; }
  .summaryTable th:first-child, .summaryTable td:first-child { text-align:left; position:sticky; left:0; background:inherit; }
  .summaryTable tbody td:first-child, .summaryTable tfoot td:first-child { background:#fff; }
  .summaryTable tbody tr:nth-child(even) td { background:#fcfcfd; }
  .summaryTable tfoot td { background:#111827; color:#fff; font-weight:800; border-bottom:0; }
  .summaryTable .catName { font-weight:700; }
  .summaryBadge { display:inline-flex; align-items:center; gap:6px; min-height:30px; padding:0 10px; border-radius:999px; background:#eef2ff; color:#3730a3; font-size:12px; font-weight:700; }
  .saveStatus { display:none !important; }
  .loginBack { position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:18px; background:linear-gradient(180deg,#f8fafc,#eef2ff); }
  .loginPanel { width:min(420px,100%); background:#fff; border:1px solid var(--line); border-radius:24px; padding:22px; box-shadow:0 20px 50px rgba(17,24,39,.14); }
  .loginPanel h2 { margin:0 0 8px; font-size:22px; letter-spacing:-.05em; }
  .loginPanel p { margin:0 0 16px; color:var(--muted); font-size:14px; line-height:1.5; }
  .loginPanel input { margin-bottom:10px; font-size:18px; font-weight:800; text-align:center; letter-spacing:.12em; }
  .loginError { color:var(--danger); font-size:13px; min-height:18px; margin-top:8px; }
  .hidden { display:none !important; }
  .bottom { position:fixed; left:0; right:0; bottom:0; z-index:20; background:rgba(255,255,255,.94); backdrop-filter:blur(10px); border-top:1px solid var(--line); padding:10px; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .notice { font-size:12px; color:var(--muted); line-height:1.45; margin-top:8px; }
  .changed { border-color:#111827; box-shadow:0 0 0 1px #111827 inset; }
  @media (min-width:700px) { .summary { grid-template-columns:repeat(4,1fr); } .toolbar { grid-template-columns:1fr 160px; } .filters { grid-template-columns:160px 160px 160px; } .modalCards { grid-template-columns:repeat(4,minmax(0,1fr)); } .bottom { max-width:960px; left:50%; transform:translateX(-50%); border:1px solid var(--line); border-bottom:0; border-radius:16px 16px 0 0; } }
</style>
</head>
<body>
<div class="loginBack" id="loginBack">
  <div class="loginPanel">
    <h2>소득세 분류 수정기</h2>
    <p>PIN을 입력하세요.</p>
    <input id="pinInput" type="password" autocomplete="current-password" placeholder="PIN" />
    <button class="primary" id="loginBtn" style="width:100%;">들어가기</button>
    <div class="loginError" id="loginError"></div>
  </div>
</div>
<header>
  <div class="topline">
    <h1>소득세 분류 수정기</h1>
    <div class="count" id="countText">불러오는 중...</div>
  </div>
  <div class="toolbar">
    <input id="searchInput" placeholder="사용처 / 금액 / 분류 검색" />
    <select id="quickFilter">
      <option value="all">전체</option>
      <option value="uncat">미분류만</option>
      <option value="changed">수정한 것만</option>
    </select>
  </div>
  <div class="filters">
    <select id="sheetFilter"><option value="all">전체 카드/계좌</option></select>
    <select id="categoryFilter"><option value="all">전체 분류</option></select>
    <select id="bulkCategory"><option value="">보이는 항목 일괄변경</option></select>
  </div>
  <div class="actions">
    <button class="primary" id="openSummaryBtn">통합확인</button>
  </div>
  <div class="saveStatus" id="saveStatus" aria-hidden="true"></div>
</header>
<main>
  <section id="list"></section>
</main>
<div class="modalBack" id="summaryModal">
  <div class="modalPanel" role="dialog" aria-modal="true" aria-labelledby="summaryModalTitle">
    <div class="modalHead">
      <div class="modalTop">
        <div>
          <h2 class="modalTitle" id="summaryModalTitle">통합확인</h2>
          <div class="modalSub">7번 탭처럼 분류별 합계를 한 화면에서 예쁘게 확인할 수 있습니다.</div>
        </div>
        <button class="ghost iconBtn" id="closeSummaryBtn" aria-label="닫기">✕</button>
      </div>
    </div>
    <div class="modalBody" id="summaryModalBody"></div>
  </div>
</div>
<div class="bottom">
  <button class="ghost" id="resetBtn">변경취소</button>
  <button class="primary" id="downloadBtn">수정 엑셀 다운로드</button>
</div>

const QUICK_CATEGORIES = ["미분류","기부금","소모품비","차량유지비","지급수수료","사무용품비","통신비","광고선전비","접대비","개인사용","제외"];
let workbook, rows = [], changed = new Map();
let APP_PIN = "";
let IS_GAS = typeof google !== "undefined" && google.script && google.script.run;
let saveTimer = null;
let pendingSave = new Map();
function b64ToArrayBuffer(b64) {
  const binary = atob(b64); const len = binary.length; const bytes = new Uint8Array(len);
  for (let i=0;i<len;i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}
function addr(col,row) { return col + row; }
function cellValue(ws, col, row) { const c = ws[addr(col,row)]; return c ? c.v : undefined; }
function excelDateToText(v) {
  if (v == null || v === "") return "";
  if (typeof v === "number") {
    const d = XLSX.SSF.parse_date_code(v); if (!d) return String(v);
    const mm = String(d.m).padStart(2,"0"), dd=String(d.d).padStart(2,"0");
    return `${d.y}-${mm}-${dd}`;
  }
  return String(v).replace(/\n/g," ");
}
function money(v) {
  const n = Number(String(v ?? 0).replace(/,/g,""));
  return Number.isFinite(n) ? Math.abs(n) : 0;
}
function fmtMoney(n) { return Math.round(n).toLocaleString("ko-KR") + "원"; }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function loadWorkbook() {
  workbook = XLSX.read(b64ToArrayBuffer(ORIGINAL_XLSX_B64), {type:"array", cellDates:false});
  rows = [];
  for (const cfg of SHEET_CONFIGS) {
    const ws = workbook.Sheets[cfg.name]; if (!ws || !ws["!ref"]) continue;
    const range = XLSX.utils.decode_range(ws["!ref"]);
    for (let r=cfg.dataStart; r<=range.e.r+1; r++) {
      const merchant = cellValue(ws,cfg.merchantCol,r);
      const amount = money(cellValue(ws,cfg.amountCol,r));
      const cat = cellValue(ws,cfg.categoryCol,r) || "미분류";
      if (!merchant && !amount) continue;
      const id = `${cfg.name}!${cfg.categoryCol}${r}`;
      rows.push({ id, sheet:cfg.name, row:r, date:excelDateToText(cellValue(ws,cfg.dateCol,r)), merchant:String(merchant ?? ""), amount, category:String(cat), originalCategory:String(cat), categoryCell:addr(cfg.categoryCol,r) });
      if (!CATEGORIES.includes(String(cat))) CATEGORIES.push(String(cat));
    }
  }
}
function initFilters() {
  const sheetFilter = document.getElementById("sheetFilter");
  for (const cfg of SHEET_CONFIGS) sheetFilter.insertAdjacentHTML("beforeend", `<option value="${esc(cfg.name)}">${esc(cfg.name)}</option>`);
  const catOpts = CATEGORIES.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");
  document.getElementById("categoryFilter").insertAdjacentHTML("beforeend", catOpts);
  document.getElementById("bulkCategory").insertAdjacentHTML("beforeend", catOpts);
}
function currentCategory(row) { return changed.has(row.id) ? changed.get(row.id) : row.category; }
function filteredRows() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const sf = document.getElementById("sheetFilter").value;
  const cf = document.getElementById("categoryFilter").value;
  const qf = document.getElementById("quickFilter").value;
  return rows.filter(row => {
    const cat = currentCategory(row);
    if (sf !== "all" && row.sheet !== sf) return false;
    if (cf !== "all" && cat !== cf) return false;
    if (qf === "uncat" && cat !== "미분류") return false;
    if (qf === "changed" && !changed.has(row.id)) return false;
    if (q) {
      const hay = `${row.sheet} ${row.date} ${row.merchant} ${row.amount} ${cat}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}
function renderSummary() {
  const box = document.getElementById("summaryBox");
  if (!box) return;
  const sums = new Map();
  for (const row of rows) { const cat=currentCategory(row); sums.set(cat,(sums.get(cat)||0)+row.amount); }
  const top = [...sums.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8);
  box.innerHTML = top.map(([cat,sum])=>`<div class="sumitem"><b>${esc(cat)}</b><span>${fmtMoney(sum)}</span></div>`).join("");
}
function setStatus(msg) {
  // 화면에는 시스템/저장 메시지를 표시하지 않습니다.
  const el = document.getElementById("saveStatus");
  if (el) el.textContent = msg || "";
}
function setRowCategory(row, nextCategory) {
  if (nextCategory === row.originalCategory) changed.delete(row.id); else changed.set(row.id, nextCategory);
  pendingSave.set(row.id, {
    id: row.id,
    sheet: row.sheet,
    row: row.row,
    date: row.date,
    merchant: row.merchant,
    amount: row.amount,
    originalCategory: row.originalCategory,
    category: nextCategory
  });
  scheduleSave();
}
function scheduleSave() {
  if (!IS_GAS || !APP_PIN) {
    setStatus("");
    return;
  }
  setStatus("저장 대기 중...");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 450);
}
function flushSave() {
  if (!pendingSave.size || !IS_GAS || !APP_PIN) return;
  const updates = Array.from(pendingSave.values());
  pendingSave.clear();
  setStatus(`저장 중... ${updates.length}건`);
  google.script.run
    .withSuccessHandler(res => {
      setStatus(`자동저장 완료 · 수정 ${res.changedCount || changed.size}건`);
    })
    .withFailureHandler(err => {
      updates.forEach(u => pendingSave.set(u.id, u));
      setStatus("저장 실패: " + (err && err.message ? err.message : err));
    })
    .saveChanges(APP_PIN, updates);
}
function renderCategoryButtons(row, pool, current) {
  return pool.map(cat => {
    const classes = ["catBtn"];
    if (cat === current) classes.push("active");
    if (cat === row.originalCategory) classes.push("is-original");
    return `<button type="button" class="${classes.join(" ")}" data-role="cat" data-id="${esc(row.id)}" data-category="${esc(cat)}">${esc(cat)}</button>`;
  }).join("");
}
function renderList() {
  const list = document.getElementById("list");
  const fr = filteredRows();
  document.getElementById("countText").textContent = `${fr.length.toLocaleString("ko-KR")}건 / 전체 ${rows.length.toLocaleString("ko-KR")}건 / 수정 ${changed.size.toLocaleString("ko-KR")}건`;
  list.innerHTML = fr.slice(0,500).map(row => {
    const cat = currentCategory(row);
    const quickPool = [...new Set([cat, row.originalCategory, ...QUICK_CATEGORIES].filter(c => CATEGORIES.includes(c)))];
    const allOpen = quickPool.length >= CATEGORIES.length ? ' open' : '';
    return `<article class="row ${changed.has(row.id)?'changed':''}" data-id="${esc(row.id)}">
      <div class="meta"><span>${esc(row.sheet)} · ${esc(row.date)} · ${row.row}행</span><span>${changed.has(row.id)?'수정됨':'원본'}</span></div>
      <div class="merchant">${esc(row.merchant)}</div>
      <div class="amount">${fmtMoney(row.amount)}</div>
      <div class="categoryBlock">
        <div class="currentCategoryLabel"><span>현재 분류</span><span class="currentCategoryValue">${esc(cat)}</span></div>
        <div class="quickPad">${renderCategoryButtons(row, quickPool, cat)}${quickPool.length < CATEGORIES.length ? `<button type="button" class="moreBtn" data-role="toggle-all" data-id="${esc(row.id)}">전체 분류</button>` : ``}</div>
        <div class="allPad${allOpen}" data-role="all-pad" data-id="${esc(row.id)}">${renderCategoryButtons(row, CATEGORIES, cat)}</div>
        <div class="catHint">자주 쓰는 분류는 바로 탭, 필요한 게 없으면 “전체 분류”를 눌러서 손으로 찍으세요.</div>
      </div>
    </article>`;
  }).join("") + (fr.length>500 ? `<div class="notice">검색 결과가 500건을 넘어서 앞 500건만 표시합니다. 검색/필터를 좁혀주세요.</div>` : "");
  list.querySelectorAll('button[data-role="cat"]').forEach(btn => {
    btn.addEventListener('click', e => {
      const row = rows.find(r=>r.id===e.currentTarget.dataset.id);
      setRowCategory(row, e.currentTarget.dataset.category);
      renderSummary(); renderList();
    });
  });
  list.querySelectorAll('button[data-role="toggle-all"]').forEach(btn => {
    btn.addEventListener('click', e => {
      const article = e.currentTarget.closest('.row');
      const pad = article.querySelector('[data-role="all-pad"]');
      const isOpen = pad.classList.toggle('open');
      e.currentTarget.textContent = isOpen ? '접기' : '전체 분류';
    });
  });
}
function renderAll() { renderSummary(); renderList(); }
function buildSummaryModel() {
  const sheets = SHEET_CONFIGS.map(c=>c.name);
  const sums = {};
  for (const cat of CATEGORIES) sums[cat] = Object.fromEntries(sheets.map(s=>[s,0]));
  for (const row of rows) {
    const cat = currentCategory(row);
    if (!sums[cat]) sums[cat] = Object.fromEntries(sheets.map(s=>[s,0]));
    sums[cat][row.sheet] += row.amount;
  }
  const usedCats = Object.keys(sums).filter(cat => cat === "미분류" || sheets.some(s => Math.round(sums[cat][s] || 0) !== 0));
  const rowTotals = Object.fromEntries(usedCats.map(cat => [cat, sheets.reduce((acc, s) => acc + Math.round(sums[cat][s] || 0), 0)]));
  const sheetTotals = Object.fromEntries(sheets.map(s => [s, usedCats.reduce((acc, cat) => acc + Math.round(sums[cat][s] || 0), 0)]));
  const grandTotal = Object.values(sheetTotals).reduce((a,b)=>a+b,0);
  return { sheets, sums, usedCats, rowTotals, sheetTotals, grandTotal };
}
function renderSummaryModal() {
  const body = document.getElementById('summaryModalBody');
  const model = buildSummaryModel();
  const prettyDate = new Date().toLocaleString('ko-KR');
  const cards = `
    <div class="modalCards">
      <div class="modalCard"><b>전체 합계</b><strong>${fmtMoney(model.grandTotal)}</strong></div>
      <div class="modalCard"><b>분류 수</b><strong>${model.usedCats.length.toLocaleString('ko-KR')}개</strong></div>
      <div class="modalCard"><b>수정 건수</b><strong>${changed.size.toLocaleString('ko-KR')}건</strong></div>
      <div class="modalCard"><b>기준 시각</b><strong style="font-size:15px;">${esc(prettyDate)}</strong></div>
    </div>`;
  const head = `<div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; flex-wrap:wrap;"><span class="summaryBadge">분류별 합산표</span><span class="summaryBadge">카드/계좌 ${model.sheets.length}개</span></div>`;
  const thead = `<thead><tr><th>분류</th>${model.sheets.map(s=>`<th>${esc(s)}</th>`).join('')}<th>합계</th></tr></thead>`;
  const tbody = `<tbody>${model.usedCats.map(cat => `<tr><td class="catName">${esc(cat)}</td>${model.sheets.map(s=>`<td>${fmtMoney(model.sums[cat][s] || 0)}</td>`).join('')}<td><b>${fmtMoney(model.rowTotals[cat] || 0)}</b></td></tr>`).join('')}</tbody>`;
  const tfoot = `<tfoot><tr><td>전체합계</td>${model.sheets.map(s=>`<td>${fmtMoney(model.sheetTotals[s] || 0)}</td>`).join('')}<td>${fmtMoney(model.grandTotal)}</td></tr></tfoot>`;
  body.innerHTML = `${head}${cards}<div class="summaryTableWrap"><table class="summaryTable">${thead}${tbody}${tfoot}</table></div>`;
}
function openSummaryModal() {
  renderSummaryModal();
  document.getElementById('summaryModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeSummaryModal() {
  document.getElementById('summaryModal').classList.remove('open');
  document.body.style.overflow = '';
}
function applyBulk() {
  const cat = document.getElementById("bulkCategory").value; if (!cat) return alert("일괄 변경할 분류를 먼저 고르세요.");
  const fr = filteredRows();
  if (!confirm(`현재 보이는 ${fr.length}건을 '${cat}'로 바꿀까요?`)) return;
  for (const row of fr) setRowCategory(row, cat);
  renderAll();
}
function applyChangesToWorkbook() {
  for (const row of rows) {
    const cat = currentCategory(row);
    const ws = workbook.Sheets[row.sheet];
    ws[row.categoryCell] = { t:"s", v:cat };
  }
  const summaryName = "분류별합산";
  if (!workbook.Sheets[summaryName]) workbook.Sheets[summaryName] = {};
  if (!workbook.SheetNames.includes(summaryName)) workbook.SheetNames.push(summaryName);
  const model = buildSummaryModel();
  const aoa = [["분류", ...model.sheets, "합계"]];
  for (const cat of model.usedCats) {
    aoa.push([cat, ...model.sheets.map(s=>Math.round(model.sums[cat][s]||0)), model.rowTotals[cat] || 0]);
  }
  aoa.push(["전체합계", ...model.sheets.map(s=>model.sheetTotals[s] || 0), model.grandTotal]);
  workbook.Sheets[summaryName] = XLSX.utils.aoa_to_sheet(aoa);
}
function downloadXlsx() {
  applyChangesToWorkbook();
  XLSX.writeFile(workbook, FILE_NAME, {bookType:"xlsx", compression:true});
}
function resetChanges() {
  if (!changed.size) return;
  if (!confirm("수정한 분류를 모두 취소할까요?")) return;
  changed.clear();
  pendingSave.clear();
  renderAll();
  if (IS_GAS && APP_PIN) {
    setStatus("변경취소 저장 중...");
    google.script.run
      .withSuccessHandler(() => setStatus("변경취소 완료"))
      .withFailureHandler(err => setStatus("변경취소 저장 실패: " + (err && err.message ? err.message : err)))
      .resetChanges(APP_PIN);
  }
}

function applyServerState(state) {
  changed = new Map();
  if (state && state.changes) {
    Object.entries(state.changes).forEach(([id, cat]) => changed.set(id, cat));
  }
  renderAll();
  setStatus(`GAS 저장본 불러옴 · 수정 ${changed.size.toLocaleString("ko-KR")}건`);
}
function unlockWithPin() {
  const pin = document.getElementById("pinInput").value.trim();
  const err = document.getElementById("loginError");
  if (!pin) {
    err.textContent = "PIN을 입력하세요.";
    return;
  }
  APP_PIN = pin;
  err.textContent = "";
  if (!IS_GAS) {
    document.getElementById("loginBack").style.display = "none";
    setStatus("");
    renderAll();
    return;
  }
  err.textContent = "확인 중...";
  google.script.run
    .withSuccessHandler(state => {
      document.getElementById("loginBack").style.display = "none";
      applyServerState(state);
    })
    .withFailureHandler(e => {
      APP_PIN = "";
      err.textContent = e && e.message ? e.message : "PIN 확인 실패";
    })
    .getState(pin);
}

window.addEventListener("DOMContentLoaded", () => {
  try {
    loadWorkbook(); initFilters(); renderAll();
    ["searchInput","sheetFilter","categoryFilter","quickFilter"].forEach(id => document.getElementById(id).addEventListener("input", renderList));
    const applyBulkBtn = document.getElementById("applyBulkBtn"); if (applyBulkBtn) applyBulkBtn.addEventListener("click", applyBulk);
    document.getElementById("openSummaryBtn").addEventListener("click", openSummaryModal);
    document.getElementById("closeSummaryBtn").addEventListener("click", closeSummaryModal);
    document.getElementById("summaryModal").addEventListener("click", e => { if (e.target.id === "summaryModal") closeSummaryModal(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeSummaryModal(); });
    document.getElementById("downloadBtn").addEventListener("click", downloadXlsx);
    const downloadTopBtn = document.getElementById("downloadTopBtn"); if (downloadTopBtn) downloadTopBtn.addEventListener("click", downloadXlsx);
    document.getElementById("resetBtn").addEventListener("click", resetChanges);
    document.getElementById("loginBtn").addEventListener("click", unlockWithPin);
    document.getElementById("pinInput").addEventListener("keydown", e => { if (e.key === "Enter") unlockWithPin(); });
  } catch(e) { document.body.innerHTML = `<main><h1>불러오기 실패</h1><p>${esc(e.message)}</p></main>`; console.error(e); }
});
</script>
</body>
